<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
        :root {
            --primary-color: #2E7D32;
            /* Adjust to your preferred green */
            --font-family: Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* MAIN CONTAINER */
        .signup-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
           
            padding: 2rem 1.5rem;
            
        }

        /* ILLUSTRATION & TITLE */
        .illustration {
            width: 100%;
            height: 150px;
            margin-bottom: 1rem;
            border-radius: 10px;
            background: url('https://res.cloudinary.com/diryolcmm/image/upload/v1744117247/DALL_E_2025-04-08_18.21.48_-_A_high-resolution_flat_vector-style_illustration_of_a_man_scanning_a_giant_QR_code_on_a_smartphone._The_man_is_holding_a_phone_and_wearing_a_green_hoo_kp8hcu.webp') no-repeat center/contain;
        }

        .signup-container h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
            color: #333;
        }

        .signup-container p {
            margin-bottom: 1.5rem;
            color: #666;
        }

        /* FORM FIELDS */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus {
            border-color: var(--primary-color);
        }

        /* TERMS & CHECKBOX */
        .terms-container {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .terms-container input[type="checkbox"] {
            margin-right: 0.5rem;
        }

        .terms-container label {
            color: #333;
            cursor: pointer;
        }

        /* BUTTON */
        .btn-signup {
            width: 100%;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 0.75rem;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-signup:hover {
            background-color: #256225;
        }

        /* LOGIN LINK */
        .login-link {
            margin-top: 1rem;
            text-align: center;
            color: #555;
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* MEDIA QUERIES */
        @media (min-width: 768px) {
            .signup-container {
                padding: 2.5rem 2rem;
            }

            .signup-container h2 {
                font-size: 2rem;
            }

            .signup-container p {
                font-size: 1.1rem;
            }

            .btn-signup {
                font-size: 1.1rem;
            }
        }
         /* Main container */
    .login-container {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 8px;
        padding: 2rem 1.5rem;
        
        text-align: center;
      }
  
      /* Illustration section */
      .illustration2 {
        width: 100%;
        height: 180px;
        background: url('https://res.cloudinary.com/diryolcmm/image/upload/v1744117246/DALL_E_2025-04-08_18.23.48_-_A_clean_flat_vector-style_illustration_with_a_pure_white_background._The_scene_shows_a_woman_holding_a_phone_standing_beside_large_digital_devices_i_e0dtgi.webp') no-repeat center/contain;
        margin-bottom: 1rem;
      }
  
      /* Titles */
      .login-container h2 {
        font-size: 1.5rem;
        margin-bottom: 0.3rem;
        color: #333;
      }
      .login-container p.subtitle {
        font-size: 1rem;
        color: #666;
        margin-bottom: 1.5rem;
      }
  
      /* Form styles */
      .login-form {
        text-align: left;
      }
      .form-group2 {
        margin-bottom: 1rem;
        position: relative; /* for the eye icon positioning */
      }
      .form-group2 label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #333;
      }
      .form-group2 input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 1rem;
        outline: none;
      }
      .form-group2 input:focus {
        border-color: var(--primary-color);
      }
  
      /* Eye icon (toggle password) */
      .toggle-password-btn {
        position: absolute;
        top: 38px;
        right: 10px;
        background: transparent;
        border: none;
        cursor: pointer;
      }
      .toggle-password-icon {
        width: 20px;
        height: 20px;
        fill: #999;
      }
  
      /* Forgot password link */
      .forgot-password {
        display: inline-block;
        margin-top: 0.3rem;
        margin-bottom: 1.2rem;
        font-size: 0.9rem;
        color: var(--primary-color);
        
        text-decoration: none;
      }
      .forgot-password:hover {
        text-decoration: underline;
      }
  
      /* Login button */
      .btn-login {
        display: block;
        width: 100%;
        background: var(--primary-color);
        color: #fff;
        font-size: 1rem;
        font-weight: 500;
        border: none;
        border-radius: 4px;
        padding: 0.75rem;
        cursor: pointer;
        margin-bottom: 1rem;
      }
      .btn-login:hover {
        background: #256225;
      }
  
      /* Sign up link at bottom */
      .bottom-text {
        font-size: 0.9rem;
        color: #555;
        text-align: center;
      }
      .bottom-text a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 500;
      }
      .bottom-text a:hover {
        text-decoration: underline;
      }
  
      /* Media queries */
      @media (min-width: 600px) {
        .login-container {
          padding: 2.5rem 2rem;
        }
        .login-container h2 {
          font-size: 1.75rem;
        }
        .login-container p.subtitle {
          font-size: 1.1rem;
        }
        .btn-login {
          font-size: 1.1rem;
        }
      }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="js/auth.js">
  </script>
</head>

<body>
    <div class="signup-container" id="signup">
        <!-- Illustration (Replace with your own image if desired) -->
        <div class="illustration"></div>

        <h2>Sign Up</h2>
        <p>Create a new account to continue</p>

        <form>
            <div class="form-group">
                <label for="email">Enter your </label>
                <input id="email" type="email" placeholder="example@domain.com" required />
            </div>
            <div class="form-group">
                <label for="setpassword">Set Password </label>
                <input id="setpassword" type="password" placeholder="set password" required />
            </div>

            <div class="form-group">
                <label for="confirmpassword">Confirm Password </label>
                <input id="confirmpassword" type="password" placeholder="confirm password" required />
            </div>

            <div class="terms-container">
                <input type="checkbox" id="terms" required />
                <label for="terms">By ticking you agree to our <a href="#">Terms and Policies</a></label>
            </div>

            <button type="submit" class="btn-signup" id="signupbtn">Sign Up</button>
        </form>

        <div class="login-link" >
            Already have an Account? <a id="loginlink">Log in</a>
        </div>
    </div>
    <div class="login-container d-none" id="login">
        <!-- Illustration -->
        <div class="illustration2"></div>
    
        <h2>Welcome Back !</h2>
        <p class="subtitle">Log in to Continue</p>
    
        <form class="login-form">
          <!-- Email/Phone -->
          <div class="form-group2">
            <label for="emailOrPhone">Enter your Email ID/Phone number</label>
            <input id="emailOrPhone" type="text" placeholder="mailtoprassath007@gmail.com" required />
          </div>
    
          <!-- Password -->
          <div class="form-group2">
            <label for="password">Enter your password</label>
            <input id="password" type="password" placeholder="********" required />
            <!-- Toggle password visibility button -->
            <button 
              type="button" 
              class="toggle-password-btn" 
              onclick="togglePasswordVisibility()">
              <svg class="toggle-password-icon" viewBox="0 0 24 24">
                <path d="M12 4.5c-7.73 0-11 5.7-11 5.7-.09.14-.09.31 0 
                .45 0 0 3.27 5.7 11 5.7 7.73 
                0 11-5.7 11-5.7.09-.14.09-.31 
                0-.45 0 0-3.27-5.7-11-5.7zm0 
                9.75c-2.25 0-4.08-1.83-4.08-4.08 
                0-2.25 1.83-4.08 4.08-4.08 
                2.25 0 4.08 1.83 4.08 4.08 
                0 2.25-1.83 4.08-4.08 4.08zm0-6.66a2.58 
                2.58 0 1 0 0 5.16 2.58 2.58 0 
                0 0 0-5.16z"></path>
              </svg>
            </button>
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>
    
          <!-- Log In Button -->
          <button class="btn-login" type="submit">Log In</button>
        </form>
    
        <!-- Sign Up Link -->
        <div class="bottom-text"  >
          Don’t have Account? <a id="signuplink">Sign up</a>
        </div>
      </div>
</body>

</html>
