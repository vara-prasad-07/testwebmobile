<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Prevent scrolling */
        }
        
        .intro-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        #introVideo {
            position: absolute;
            width: auto;
            height: 100%;
            /* For wider screens, ensure video fills width instead */
            @media (min-aspect-ratio: 9/16) {
                width: 100%;
                height: auto;
            }
            /* Maintain aspect ratio while covering container */
            object-fit: contain;
            max-width: 100%;
            margin: auto;
        }
    
        /* Add specific handling for different device orientations */
        @media screen and (orientation: landscape) {
            #introVideo {
                width: auto;
                height: 100vh;
            }
        }
    
        @media screen and (orientation: portrait) {
            #introVideo {
                width: 100vw;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="intro-container">
        <video id="introVideo" autoplay muted>
            <source src="https://res.cloudinary.com/diryolcmm/video/upload/v1744375640/Untitled_design_ned5c2.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('introVideo');
            
            // Check for existing user
            const checkAuthAndRedirect = () => {
                const authLogs = localStorage.getItem('authLogs');
                
                if (authLogs) {
                    try {
                        const uid = JSON.parse(authLogs)[0]['uid'];
                        if (uid) {
                            window.location.href = 'templetes/home.html';
                        } else {
                            window.location.href = 'templetes/intro.html';
                        }
                    } catch (error) {
                        console.error('Error parsing authLogs:', error);
                        window.location.href = 'templetes/intro.html';
                    }
                } else {
                    window.location.href = 'templetes/intro.html';
                }
            };

            // When video ends or if video fails to load
            video.addEventListener('ended', checkAuthAndRedirect);
            video.addEventListener('error', checkAuthAndRedirect);

            // Fallback: If video doesn't play within 5 seconds
            setTimeout(checkAuthAndRedirect, 5000);
        });
    </script>
</body>
</html>
